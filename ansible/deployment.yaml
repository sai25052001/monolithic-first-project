---
- hosts: tag_Name_monolithic_Instance
  become: yes
  vars:
    ansible_ssh_private_key_file: "/etc/ansible/SaiCharanKeyPair.pem"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    remote_user: ubuntu

  tasks:
    - name: Update package cache (Ubuntu)
      apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install web server (Ubuntu)
      apt:
        name: apache2
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install web server (RHEL-based)
      dnf:
        name: httpd
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Ensure web server is started and enabled
      service:
        name: "{{ 'apache2' if ansible_facts['os_family'] == 'Debian' else 'httpd' }}"
        state: started
        enabled: yes

    - name: Install Git
      package:
        name: git
        state: present

    - name: Ensure /var/www exists
      file:
        path: /var/www
        state: directory
        mode: '0755'

    - name: Ensure /var/www/html exists
      file:
        path: /var/www/html
        state: directory
        mode: '0755'
        owner: www-data
        group: www-data
      when: ansible_facts['os_family'] == "Debian"

    - name: Ensure /var/www/html exists (RHEL)
      file:
        path: /var/www/html
        state: directory
        mode: '0755'
        owner: apache
        group: apache
      when: ansible_facts['os_family'] == "RedHat"

    - name: Clone frontend code from GitHub
      git:
        repo: https://github.com/lit/lit.git
        dest: /var/www/html/
        version: frontend
      notify: Restart web server

  handlers:
    - name: Restart web server
      service:
        name: "{{ 'apache2' if ansible_facts['os_family'] == 'Debian' else 'httpd' }}"
        state: restarted
