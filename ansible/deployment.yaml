---
- hosts: tag_Name_monolithic_Instance
  become: yes
  vars:
    ansible_ssh_private_key_file: "/etc/ansible/SaiCharanKeyPair.pem"
    ansible_ssh_user: "ubuntu"

  tasks:
    - name: install httpd
      action: yum name=httpd state=present

    - name: restart httpd
      service: name=httpd state=restarted

    - name: install git in dev server
      action: yum name=git state=present

    - name: get code from github
      git:
        repo: https://github.com/lit/lit.git
        dest: /var/www/html/
        version: frontend
